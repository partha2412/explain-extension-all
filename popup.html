<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Explain This</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="header">
  <div class="logo">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>Explain This</h1>
    <p>Highlight text on any page → click Explain</p>
  </div>
</div>

<!-- API Key -->

<div class="label">API Key</div>
<div class="field">
  <div class="input-wrap">
    <input type="password" id="api-key" placeholder="Paste any API key..." autocomplete="off"/>
    <span class="show-toggle" id="toggle-vis">show</span>
  </div>
  <div class="detected">
    <span class="badge none" id="detected-badge">No key detected</span>
  </div>
</div>

<!-- Ollama URL — only shown for Ollama -->

<div class="field hidden" id="field-url">
  <div class="label">Base URL</div>
  <div class="input-wrap">
    <input type="text" id="base-url" placeholder="http://localhost:11434"/>
  </div>
</div>

<!-- Model selector — appears after detection -->

<div class="field hidden" id="field-model">
  <div class="label">Model</div>
  <div class="model-pills" id="model-pills"></div>
  <div class="input-wrap">
    <input type="text" id="model" placeholder="or type a model name..."/>
  </div>
</div>

<div class="divider"></div>

<div class="field">
  <label for="explain-style">Explanation Style</label>

  <select id="explain-style">
    <option value="eli5">Easy</option>
    <option value="normal">Normal</option>
    <option value="technical">Technical</option>
    <option value="summary">Summary</option>
    <option value="mcq">MCQ Solver</option>
    <option value="qa">Question Answer</option>
  </select>
</div>

<!-- Max Tokens -->

<div class="tokens-row">
  <span class="label">Max Tokens</span>
  <input type="number" id="max-tokens" value="200" min="50" max="4000"/>
  <span style="font-size:10px;color:#3f3f46;">tokens per reply</span>
</div>

<button class="save" id="save-btn">Save Settings</button>

<div class="status" id="status"></div>

<div class="hint">
  OpenAI · Claude · Gemini · Groq · Mistral<br/>
  Together · HuggingFace · Ollama · Custom
</div>

<script src="popup.js"></script>

</body>
</html>
